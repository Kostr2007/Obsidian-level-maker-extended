<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#263041" stroke-width=".7"/></pattern></defs><rect x="0" y="0" width="1120" height="650" rx="16" fill="#171e29" stroke="none" stroke-width="3"/><text x="40" y="47" fill="#7da8e3" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="600">OBSIDIAN / STUDIO     •     ИЛЛЮСТРАЦИЯ ПАРАМЕТРА</text><text x="40" y="98" fill="#edf3ff" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="600">Перепады высоты</text><text x="40" y="134" fill="#b2bed1" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Ступени и переходы между областями. Высота помещений — отдельный параметр.</text><rect x="40" y="164" width="500" height="376" rx="10" fill="#1c2635" stroke="#34445a" stroke-width="3"/><rect x="54" y="214" width="472" height="310" rx="4" fill="url(#grid)" stroke="none" stroke-width="3"/><text x="64" y="199" fill="#edf3ff" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="600">Плавные перепады</text><rect x="580" y="164" width="500" height="376" rx="10" fill="#1c2635" stroke="#34445a" stroke-width="3"/><rect x="594" y="214" width="472" height="310" rx="4" fill="url(#grid)" stroke="none" stroke-width="3"/><text x="604" y="199" fill="#edf3ff" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="600">Более выраженные перепады</text><rect x="75" y="255" width="430" height="14" rx="0" fill="#73879f" stroke="none" stroke-width="3"/><rect x="75" y="470" width="430" height="22" rx="0" fill="#536983" stroke="none" stroke-width="3"/><path d="M75 470 H190 V463 H225 V456 H260 V449 H295 V442 H330 V435 H365 H505 V492 H75 Z" fill="#34465b" stroke="#adc1dd" stroke-width="3" /><g transform="translate(135 440)"><circle cy="-20" r="7" fill="#74b4ff"/><path d="M0 -12 L0 8 M-10 -5 L0 -10 L10 -4 M0 8 L-8 24 M0 8 L10 24" fill="none" stroke="#74b4ff" stroke-width="6" /></g><path d="M475 465 V435" fill="none" stroke="#edb278" stroke-width="3" /><text x="90" y="305" fill="#b2bed1" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Лестница / переход</text><text x="90" y="329" fill="#7d8da5" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Высота потолка не меняется</text><rect x="615" y="255" width="430" height="14" rx="0" fill="#73879f" stroke="none" stroke-width="3"/><rect x="615" y="470" width="430" height="22" rx="0" fill="#536983" stroke="none" stroke-width="3"/><path d="M615 470 H730 V448 H765 V426 H800 V404 H835 V382 H870 V360 H905 H1045 V492 H615 Z" fill="#34465b" stroke="#adc1dd" stroke-width="3" /><g transform="translate(675 440)"><circle cy="-20" r="7" fill="#74b4ff"/><path d="M0 -12 L0 8 M-10 -5 L0 -10 L10 -4 M0 8 L-8 24 M0 8 L10 24" fill="none" stroke="#74b4ff" stroke-width="6" /></g><path d="M1015 465 V360" fill="none" stroke="#edb278" stroke-width="3" /><text x="630" y="305" fill="#b2bed1" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Лестница / переход</text><text x="630" y="329" fill="#7d8da5" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Высота потолка не меняется</text><text x="40" y="585" fill="#b2bed1" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Сравнивается один параметр. Остальные условия одинаковы.</text><text x="40" y="615" fill="#7d8da5" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Условный пример: конкретная карта зависит от всех настроек генератора.</text></svg>