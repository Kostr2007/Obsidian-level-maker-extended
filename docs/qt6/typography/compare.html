<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian — типографика до и после</title>
<style>body{margin:0;background:#202023;color:#f0f0f3;font:15px system-ui}header{position:sticky;top:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:#29292d}button,select{font:inherit;color:inherit;background:#38383e;border:1px solid #65656c;border-radius:6px;padding:6px 10px}button[aria-pressed=true]{background:#0069d9}main{overflow:auto;padding:16px}img{display:block;max-width:100%;height:auto;margin:auto}body.actual img{max-width:none}p{margin:0;font-size:13px;color:#c4c4cc}</style>
<header><strong>Реальные снимки Qt</strong><select id="scene" aria-label="Экран"><option value="geometry">Геометрия</option><option value="project">Игра и формат</option><option value="game-dialog">Диалог настройки</option></select><select id="theme" aria-label="Тема"><option value="dark">Тёмная тема</option><option value="light">Светлая тема</option></select><button id="old" aria-pressed="false">До</button><button id="new" aria-pressed="true">После</button><label><input type="checkbox" id="actual">1:1 пиксели</label><p>Для оценки мелкого текста включите 1:1; масштаб браузера — 100%. Файлы снимков не ретушировались.</p></header><main><img id="shot" alt="Снимок интерфейса"></main>
<script>let stage='after';const scene=document.getElementById('scene'),theme=document.getElementById('theme'),shot=document.getElementById('shot');function update(){shot.src=stage+'/'+theme.value+'/'+scene.value+'.png';shot.alt=(stage==='after'?'После: ':'До: ')+scene.selectedOptions[0].text;document.getElementById('old').setAttribute('aria-pressed',stage==='before');document.getElementById('new').setAttribute('aria-pressed',stage==='after')}document.getElementById('old').onclick=()=>{stage='before';update()};document.getElementById('new').onclick=()=>{stage='after';update()};scene.onchange=theme.onchange=update;document.getElementById('actual').onchange=e=>document.body.classList.toggle('actual',e.target.checked);update();</script></html>
