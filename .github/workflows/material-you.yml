name: Qt 6
on:
  push:
    branches: [main, codex/material-you]
    tags: ['v*']
    paths-ignore: ['docs/**', '.extended/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt6:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Obsidian source(1)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: Obsidian source(1)
      - name: Validate release metadata and publisher
        run: |
          python3 scripts/dev/check-design-agent-setup.py
          python3 scripts/dev/capture-gameplay.py --verify-assets
          python3 scripts/dev/extract-freedoom-assets.py --verify
          python3 scripts/dev/check-font-assets.py
          python3 scripts/dev/release.py prepare
          python3 -m unittest discover -s scripts/dev/tests -v
      - name: Install Qt 6 build and QML runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build flex qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtqml-models qt6-qpa-plugins xvfb xdotool imagemagick
      - name: Verify virtual display readiness and ownership
        run: python3 -m unittest discover -s scripts/dev/tests -p 'test_xvfb_session.py' -v
      - name: Build Qt interface and console worker
        run: ./scripts/dev/build-linux.sh
      - name: Test configuration, preview, dependencies, generation and cancellation
        env:
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build/qt --output-on-failure --no-tests=error -R '^qt-core$'
      - name: Generate a map through the full QML application
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ./obsidian --smoke-output "$PWD/build/qt-smoke"
      - name: Exercise the real Qt window in both themes
        run: python3 scripts/dev/check-qt.py
      - name: Exercise the optional macOS-inspired design sample
        run: python3 scripts/dev/check-design-preview.py
      - name: Compare classic and ART-01 resource selection
        run: python3 scripts/dev/check-art01.py
      - name: Package verified Qt build
        run: ./scripts/dev/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Extended-Qt6-linux-x86_64
          path: Obsidian source(1)/build/Obsidian-Extended-Qt6-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art01-comparison
          path: Obsidian source(1)/build/art01/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt6-verification
          path: |
            Obsidian source(1)/build/qt/Testing/Temporary/LastTest.log
            Obsidian source(1)/build/qt-smoke/qt-smoke.json
            Obsidian source(1)/build/qt-ui-check/*.log
            Obsidian source(1)/build/qt-ui-check/*.png
            Obsidian source(1)/build/qt-ui-check/*/*.log
            Obsidian source(1)/build/design-preview-check/*.log
            Obsidian source(1)/build/design-preview-check/*.png
            Obsidian source(1)/build/design-preview-check/*/*.png
            Obsidian source(1)/build/design-preview-check/*/*.log
            Obsidian source(1)/build/design-preview-check/*/*.json

  release:
    name: Publish versioned release
    needs: qt6
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: material-workspace-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version and changelog
        id: metadata
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/dev/release.py prepare --notes-file build/release-notes.md)
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != "refs/tags/v$version" ]]; then
            echo 'Tag must match VERSION' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Obsidian-Extended-Qt6-linux-x86_64
          path: release
      - name: Prepare downloadable files
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mv release/Obsidian-Extended-Qt6-linux-x86_64.tar.gz "release/Obsidian-Extended-$RELEASE_VERSION-qt6-ubuntu-24.04-x86_64.tar.gz"
          git archive --format=tar.gz --prefix=Obsidian-Extended-source/ HEAD > "release/Obsidian-Extended-$RELEASE_VERSION-source.tar.gz"
          (cd release && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/dev/release.py publish release/*.tar.gz release/SHA256SUMS --repo "$GH_REPO"
